[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "owaspscan"
version = "0.10.0"
description = "Simple, extensible OWASP Top 10 web scanner for apps you are authorized to test."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
owaspscan = "owaspscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
